# CI/CD for the loan service.
#   Pull request -> test only (branch rule requires "test" before merging).
#   Merge to main -> test -> build & push image tagged with the commit SHA -> deploy to Render -> verify live.
# The live app is deployed ONLY by this pipeline (Render auto-deploy is off).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/loan-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Train the model used by the tests
        run: python train.py
      - name: Run the tests
        run: pytest -v

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy this exact image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMG=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${IMAGE}:${GITHUB_SHA}")
          curl -fsS -o /dev/null -X POST "${HOOK}&imgURL=${IMG}"
          echo "Deploy requested for ${IMAGE}:${GITHUB_SHA}"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the live app runs this commit
        env:
          APP_URL: ${{ vars.APP_URL }}
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          for i in $(seq 1 60); do
            LIVE=$(curl -fsS "$APP_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('git_sha',''))" || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "Live /health reports git_sha=$LIVE"
              python3 -c "import sys,datetime as d; m=d.datetime.fromisoformat(sys.argv[1]); n=d.datetime.now(d.timezone.utc); print(f'Merge to live: {int((n-m).total_seconds()//60)} min {int((n-m).total_seconds()%60)} s')" "$MERGED_AT"
              exit 0
            fi
            echo "Attempt $i: live git_sha='${LIVE}', waiting for ${GITHUB_SHA}..."
            sleep 15
          done
          echo "The new version did not go live within 15 minutes"; exit 1
      - name: Smoke-test the live API
        env:
          APP_URL: ${{ vars.APP_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -e
          BODY='{"amount_usd":1500,"term_months":12,"monthly_income_usd":350.0,"previous_loans":1,"late_payments":0}'
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          A=$(code -X POST "$APP_URL/api/v1/predictions" -H 'Content-Type: application/json' -d "$BODY")
          B=$(code -X POST "$APP_URL/api/v1/predictions" -H 'Content-Type: application/json' -H 'X-API-Key: wrong-key' -d "$BODY")
          C=$(code -X POST "$APP_URL/api/v1/predictions" -H 'Content-Type: application/json' -H "X-API-Key: $API_KEY" -d "$BODY")
          echo "no key -> $A (expect 401) | wrong key -> $B (expect 403) | correct key -> $C (expect 200)"
          [ "$A" = 401 ] && [ "$B" = 403 ] && [ "$C" = 200 ]
          curl -fsS -X POST "$APP_URL/api/v1/predictions" -H 'Content-Type: application/json' -H "X-API-Key: $API_KEY" -d "$BODY"; echo
